# ============================================================
# test.yml — GitHub Actions 自動化測試
#
# 每次有人推送到 main 分支，或發起 pull request 到 main 時，
# 這支 workflow 會自動：
#   1. 用最新的 Ubuntu 環境
#   2. 安裝 Python 3.10
#   3. 安裝專案依賴（HW2/requirements.txt）
#   4. 安裝 Playwright 瀏覽器（系統測試需要）
#   5. 執行 pytest HW2/tests/ 跑完整測試
#
# 用途：確保程式碼被改壞之前，先在 CI 上擋下來。
# ============================================================

name: CI - Run Tests

# 觸發條件：
# - push 到 main 分支
# - pull request 到 main 分支
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 這個 job 叫 test
  test:
    # 使用最新的 Ubuntu 環境
    runs-on: ubuntu-latest

    steps:
      # ---- 步驟 1：把程式碼下載到 runner 上 ----
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      # ---- 步驟 2：安裝指定的 Python 版本 ----
      - name: 安裝 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ---- 步驟 3：安裝所有依賴套件 ----
      # HW2/requirements.txt 已經包含專案與測試需要的套件
      - name: 安裝依賴套件
        run: |
          pip install -r HW2/requirements.txt
          pip install pytest

      # ---- 步驟 4：安裝 Playwright 瀏覽器 ----
      # 系統測試（tests/test_system.py）需要用無頭瀏覽器模擬真實學生操作
      # --with-deps 會一併安裝瀏覽器需要的系統相依套件
      - name: 安裝 Playwright 瀏覽器
        run: python -m playwright install --with-deps chromium

      # ---- 步驟 5：執行完整測試 ----
      - name: 執行 pytest 測試
        run: pytest HW2/tests/